shellEmulator: true

packages:
  - docs
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: true

packageExtensions:
  "@so1ve/eslint-config":
    dependencies:
      typescript: "^6.0.3"

catalogs:
  cli:
    "@clack/prompts": "^1.9.0"
    fast-string-width: "^3.0.2"
  dev:
    "@antfu/ni": "^30.6.0"
    "@types/node": "^26.6.6"
    "@vitest/coverage-istanbul": "^5.1.1"
    "@vitest/ui": "^5.1.1"
    bumpp: "^12.3.0"
    changelogithub: "^15.0.5"
    eslint: "^10.15.0"
    prettier: "^3.10.1"
    tsdown: "^0.23.7"
    typescript: "^7.0.2"
    vite: "^8.3.8"
    vitest: "^5.1.1"
  docs:
    "@shikijs/vitepress-twoslash": "^4.6.0"
    typedoc: "^0.28.20"
    typedoc-plugin-markdown: "^4.14.1"
    typedoc-vitepress-theme: "^1.1.4"
    typescript: "^6.0.3"
    unocss: "^66.13.0"
    vitepress: "2.0.0-alpha.21"
    vitepress-plugin-group-icons: "^1.8.2"
